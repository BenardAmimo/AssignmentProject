<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Greenfield Institute</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="page-wrapper">

  <!-- Left: Brand Panel -->
  <div class="panel-brand">
    <div class="brand-logo">
      <div class="brand-logo-icon">G</div>
      <div class="brand-name">
        Greenfield Institute
        <span>Course Registration</span>
      </div>
    </div>

    <div class="brand-content">
      <h2>Welcome back</h2>
      <div class="brand-divider"></div>
      <p>Sign in to access your courses, track your enrollments, and manage your academic schedule.</p>

       
    </div>

    <p class="brand-footer">© 2025 Greenfield Institute</p>
  </div>

  <!-- Right: Form Panel -->
  <div class="panel-form">

    <div class="form-header">
      <h1>Sign In</h1>
      <p>New here? <a href="register.html">Create an account</a></p>
    </div>

    <!-- Alert box shown/hidden by login.js -->
    <div class="alert" id="alert"></div>

    <form id="loginForm" novalidate>

      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrap">
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
            autocomplete="email"
          >
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password "
            required
            autocomplete="current-password"
          >
          <button type="button" class="toggle-pw" data-target="password">Show</button>
        </div>
      </div>

      <div class="form-footer-row">
        <a href="forgot-password.html">Forgot password?</a>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <span class="spinner" id="spinner"></span>
        <span id="btnText">Sign In →</span>
      </button>

    </form>
  </div>

</div>
<script src="../../js/api.js"></script>
<script src="login.js"></script>
</body>
</html>
